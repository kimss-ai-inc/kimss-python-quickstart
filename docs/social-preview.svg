<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI Gateway  Python Quickstart</title>
  <desc id="desc">Python agent routes through an AI gateway to OpenAI or Anthropic with identity, policy, audit, and kill switch controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1226"/>
      <stop offset="100%" stop-color="#171a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <text x="640" y="72" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700">AI GATEWAY</text>
  <text x="640" y="118" text-anchor="middle" fill="#a5adc8" font-family="Segoe UI, system-ui, sans-serif" font-size="22">Python Quickstart</text>

  <!-- Python Agent box -->
  <rect x="490" y="170" width="300" height="64" rx="12" fill="#23284a" stroke="#4b556f" stroke-width="2"/>
  <text x="640" y="210" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">Python Agent</text>
  <text x="640" y="232" text-anchor="middle" fill="#8b93b0" font-family="Segoe UI, system-ui, sans-serif" font-size="14">OpenAI SDK</text>

  <!-- Arrow 1 -->
  <line x1="640" y1="234" x2="640" y2="268" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="640,278 632,262 648,262" fill="#8b5cf6"/>

  <!-- Gateway box -->
  <rect x="420" y="280" width="440" height="120" rx="14" fill="#2a1f5e" stroke="#6366f1" stroke-width="2"/>
  <text x="640" y="322" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="700">AI Gateway</text>
  <text x="640" y="358" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="16">Identity · Policy · Audit · Kill Switch</text>

  <!-- Arrow 2 -->
  <line x1="640" y1="400" x2="640" y2="434" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="640,444 632,428 648,428" fill="#8b5cf6"/>

  <!-- Provider box -->
  <rect x="440" y="450" width="400" height="64" rx="12" fill="#23284a" stroke="#4b556f" stroke-width="2"/>
  <text x="640" y="490" text-anchor="middle" fill="#eef0fa" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">OpenAI / Anthropic</text>

  <text x="640" y="570" text-anchor="middle" fill="#6b7280" font-family="Segoe UI, system-ui, sans-serif" font-size="16">github.com/kimss-ai-inc/kimss-python-quickstart</text>
</svg>
