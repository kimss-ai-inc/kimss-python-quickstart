name: Bug report
description: Report a problem with the quickstart examples or documentation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include as much detail as possible.

  - type: input
    id: script
    attributes:
      label: Script
      description: Which script were you running?
      placeholder: demo_local_gateway.py, example_02_openai_override.py, etc.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the error occurred?
      placeholder: |
        1. git clone ...
        2. pip install -r requirements.txt
        3. python demo_local_gateway.py
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message or traceback
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local demo (demo_local_gateway.py)
        - Real Kimss gateway
        - Not sure
    validations:
      required: true
