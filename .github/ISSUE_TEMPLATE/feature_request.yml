name: Feature request
description: Suggest an improvement to the quickstart tutorial
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest improvements that keep the quickstart focused on the 5-minute gateway integration path.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for a developer trying the quickstart?
      placeholder: "I'm trying to ... but ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about?
